[project]
name = "persipep-amp-challenge"
version = "0.1.0"
description = "PersiPep submission for the AMP Challenge 2027"
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "biopython>=1.81,<2",
]

[project.scripts]
generate = "persipep_amp_challenge.generate:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persipep_amp_challenge"]
